<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수능 영단어 4000+</title>
<style>
  :root{
    --bg:#f6f5f2;
    --card:#ffffff;
    --ink:#1f2430;
    --sub:#5b6270;
    --accent:#5b4636;
    --accent2:#8a6d3b;
    --line:#e6e2da;
    --tag:#efe7d8;
    --serif: "Noto Serif KR","Georgia",serif;
    --sans: "Pretendard","Noto Sans KR",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:var(--sans);
    color:var(--ink);
    padding-bottom:60px;
  }
  header{
    padding:36px 20px 20px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fbfaf7,var(--bg));
  }
  header h1{
    font-family:var(--serif);
    font-size:28px;
    margin:0 0 6px;
    letter-spacing:-0.5px;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:14px;
  }
  .progress-wrap{
    max-width:520px;
    margin:16px auto 0;
  }
  .progress-bar{
    height:8px;
    background:var(--line);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent2);
    border-radius:99px;
  }
  .progress-label{
    font-size:12px;
    color:var(--sub);
    margin-top:6px;
  }
  .controls{
    max-width:720px;
    margin:24px auto 0;
    padding:0 20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  #search{
    flex:1;
    min-width:200px;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:15px;
    outline:none;
  }
  #search:focus{border-color:var(--accent2);}
  .count-badge{
    padding:12px 16px;
    background:var(--tag);
    border-radius:10px;
    font-size:13px;
    color:var(--accent);
    white-space:nowrap;
  }
  .quiz-btn{
    padding:12px 18px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s ease;
  }
  .quiz-btn:hover{ background:var(--accent2); }

  .start-no-bar{
    max-width:720px;
    margin:0 auto;
    padding:10px 20px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .start-no-label{
    font-size:13px;
    color:var(--sub);
    white-space:nowrap;
  }
  #startNoInput{
    width:80px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;
  }
  #startNoGoBtn{
    padding:8px 14px;
    border-radius:8px;
    border:none;
    background:var(--accent2);
    color:#fff;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  #startNoGoBtn:hover{ background:var(--accent); }
  .start-no-reset{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--sub);
    font-size:12.5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .start-no-reset:hover{ background:var(--tag); }
  .start-no-current{
    font-size:12.5px;
    color:var(--accent);
    font-weight:600;
  }

  .mark-filter-bar{
    max-width:720px;
    margin:0 auto;
    padding:0 20px 8px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mark-filter-btn{
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--accent2);
    background:var(--card);
    color:var(--accent2);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .mark-filter-btn.active{
    background:var(--accent2);
    color:#fff;
  }
  .mark-count-label{
    font-size:12.5px;
    color:var(--sub);
  }
  .mark-btn{
    border:none;
    background:none;
    font-size:19px;
    color:#d4a017;
    cursor:pointer;
    padding:0 4px;
    line-height:1;
  }
  .mark-btn.active{
    color:#d4a017;
  }
  .card.marked{
    border-left:4px solid #d4a017;
  }

  .quiz-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,15,10,0.55);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .quiz-overlay.open{ display:flex; }
  .quiz-modal{
    background:var(--card);
    border-radius:16px;
    max-width:480px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    box-shadow:0 10px 40px rgba(0,0,0,0.25);
  }
  .quiz-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    border-bottom:1px solid var(--line);
    font-family:var(--serif);
    font-size:19px;
    font-weight:700;
    color:var(--accent);
  }
  .quiz-close{
    border:none;
    background:none;
    font-size:18px;
    color:var(--sub);
    cursor:pointer;
    padding:4px 8px;
  }
  .quiz-body{ padding:22px; }
  .quiz-desc{
    font-size:14px;
    color:var(--sub);
    margin:0 0 20px;
    line-height:1.6;
  }
  .quiz-count-select label{
    font-size:13px;
    color:var(--sub);
    display:block;
    margin-bottom:8px;
  }
  .quiz-count-options{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .quiz-count-options button{
    padding:8px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:13px;
    cursor:pointer;
  }
  .quiz-count-options button.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .quiz-custom-range{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .quiz-custom-range input{
    width:80px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:13px;
    color:var(--ink);
  }
  .quiz-custom-range span{
    color:var(--sub);
    font-size:13px;
  }
  .quiz-custom-range button{
    padding:8px 14px;
    border-radius:8px;
    border:none;
    background:var(--accent2);
    color:#fff;
    font-size:13px;
    cursor:pointer;
  }
  .quiz-custom-range button:hover{ background:var(--accent); }
  .quiz-range-error{
    font-size:12px;
    color:#c0392b;
    min-height:16px;
    margin-bottom:18px;
  }
  .quiz-start-btn{
    width:100%;
    padding:14px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .quiz-start-btn:hover{ background:var(--accent2); }
  .quiz-progress{
    font-size:12.5px;
    color:var(--sub);
    margin-bottom:10px;
  }
  .quiz-question-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:4px;
  }
  .quiz-question{
    font-family:var(--serif);
    font-size:24px;
    font-weight:700;
    color:var(--accent);
    flex:1;
  }
  .quiz-speak-btn{
    width:34px;
    height:34px;
    font-size:16px;
    flex-shrink:0;
  }
  .quiz-ipa{
    font-family:monospace;
    font-size:13px;
    color:#a08c6a;
    margin-bottom:18px;
  }
  .quiz-options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .quiz-option{
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--card);
    font-size:15px;
    text-align:left;
    cursor:pointer;
    transition:all 0.12s ease;
  }
  .quiz-option:hover{ border-color:var(--accent2); }
  .quiz-option.correct{
    background:#e5f3e5;
    border-color:#4caf50;
    color:#2e6b2e;
    font-weight:600;
  }
  .quiz-option.wrong{
    background:#fbe8e8;
    border-color:#e57373;
    color:#a33;
    font-weight:600;
  }
  .quiz-option[disabled]{ cursor:default; }
  .quiz-next-btn{
    margin-top:18px;
    width:100%;
    padding:13px;
    background:var(--accent2);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .quiz-score{
    font-family:var(--serif);
    font-size:26px;
    font-weight:700;
    color:var(--accent);
    text-align:center;
    margin-bottom:20px;
  }
  .quiz-wrong-list{
    margin-bottom:20px;
    max-height:280px;
    overflow-y:auto;
  }
  .quiz-wrong-item{
    padding:10px 12px;
    border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .quiz-wrong-item b{ color:var(--accent); }
  .quiz-wrong-item .wrong-kr{ color:#a33; }
  .quiz-wrong-item .correct-kr{ color:#2e6b2e; }
  main{
    max-width:720px;
    margin:20px auto;
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    box-shadow:0 1px 2px rgba(30,20,10,0.03);
  }
  .card-top{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .no{
    font-size:12px;
    color:#b5aa96;
    font-weight:600;
    min-width:28px;
  }
  .word{
    font-family:var(--serif);
    font-size:22px;
    font-weight:700;
    color:var(--accent);
  }
  .speak-btn{
    border:none;
    background:var(--tag);
    color:var(--accent2);
    font-size:14px;
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform 0.12s ease, background 0.15s ease;
  }
  .speak-btn:hover{
    background:var(--accent2);
    color:#fff;
  }
  .speak-btn:active{
    transform:scale(0.9);
  }
  .pos{
    font-size:12px;
    color:#a08c6a;
    background:var(--tag);
    padding:2px 8px;
    border-radius:6px;
  }
  .ipa{
    font-family:"SF Mono","Courier New",monospace;
    font-size:12.5px;
    color:#a08c6a;
    margin-top:2px;
  }
  .kr{
    font-size:16px;
    margin:6px 0 8px;
    color:var(--ink);
    font-weight:500;
  }
  .syn{
    font-size:12.5px;
    color:var(--accent);
    background:#f3ede0;
    display:inline-block;
    padding:3px 10px;
    border-radius:6px;
    margin-bottom:10px;
  }
  .syn b{
    color:var(--accent2);
    margin-right:4px;
  }
  .ant{
    font-size:12.5px;
    color:#a04040;
    background:#f7e9e6;
    display:inline-block;
    padding:3px 10px;
    border-radius:6px;
    margin-bottom:10px;
    margin-left:6px;
  }
  .ant b{
    color:#b94a3f;
    margin-right:4px;
  }
  .root{
    font-size:13px;
    color:var(--sub);
    background:#faf8f4;
    border-left:3px solid var(--accent2);
    padding:8px 12px;
    border-radius:6px;
    margin-bottom:12px;
    line-height:1.5;
  }
  .root b{color:var(--accent);}
  .ex{
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    font-style:italic;
    border-top:1px dashed var(--line);
    padding-top:10px;
  }
  .exkr{
    font-size:13.5px;
    color:var(--sub);
    margin-top:4px;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    padding:60px 0;
    font-size:14px;
  }
  footer{
    text-align:center;
    color:var(--sub);
    font-size:12px;
    margin-top:30px;
  }
</style>
</head>
<body>

<header>
  <h1>수능 영단어 4000+</h1>
  <p>영단어 · 한글 뜻 · 어원 · 예문 (영/한)</p>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="단어 또는 한글 뜻 검색...">
  <div class="count-badge" id="resultCount"></div>
  <button class="quiz-btn" id="quizOpenBtn">📝 누적테스트</button>
</div>

<div class="start-no-bar">
  <span class="start-no-label">📍 외우기 시작 번호</span>
  <input id="startNoInput" type="number" min="1" placeholder="No.">
  <button id="startNoGoBtn">여기부터 보기</button>
  <button id="startNoResetBtn" class="start-no-reset">처음부터</button>
  <span class="start-no-current" id="startNoCurrent"></span>
</div>

<div class="mark-filter-bar">
  <button id="markFilterBtn" class="mark-filter-btn">📌 체크한 단어만 보기</button>
  <span class="mark-count-label" id="markCountLabel"></span>
</div>

<div class="quiz-overlay" id="quizOverlay">
  <div class="quiz-modal">
    <div class="quiz-header">
      <span id="quizTitle">누적 테스트</span>
      <button class="quiz-close" id="quizCloseBtn">✕</button>
    </div>
    <div id="quizSetup" class="quiz-body">
      <p class="quiz-desc">현재까지 등록된 <b id="quizPoolCount">0</b>개 단어 중에서 문제를 출제합니다.</p>

      <div class="quiz-count-select">
        <label>출제 범위</label>
        <div class="quiz-count-options" id="quizRangeOptions"></div>
        <div class="quiz-custom-range">
          <input type="number" id="quizRangeStart" placeholder="시작 No." min="1">
          <span>–</span>
          <input type="number" id="quizRangeEnd" placeholder="끝 No." min="1">
          <button id="quizRangeApplyBtn">적용</button>
        </div>
        <div class="quiz-range-error" id="quizRangeError"></div>
      </div>

      <div class="quiz-count-select">
        <label>출제 방향</label>
        <div class="quiz-count-options" id="quizDirOptions">
          <button data-dir="e2k" class="active">영어 → 한글 뜻</button>
          <button data-dir="k2e">한글 뜻 → 영어</button>
        </div>
      </div>

      <div class="quiz-count-select">
        <label>문제 수</label>
        <div class="quiz-count-options" id="quizCountOptions">
          <button data-n="10">10개</button>
          <button data-n="20" class="active">20개</button>
          <button data-n="30">30개</button>
          <button data-n="50">50개</button>
          <button data-n="100">100개</button>
          <button data-n="all">전체</button>
        </div>
      </div>

      <div class="quiz-count-select">
        <label>선택지 수</label>
        <div class="quiz-count-options" id="quizChoiceOptions">
          <button data-c="4" class="active">4지선다</button>
          <button data-c="5">5지선다</button>
          <button data-c="6">6지선다</button>
        </div>
      </div>

      <button class="quiz-start-btn" id="quizStartBtn">테스트 시작</button>
    </div>
    <div id="quizPlay" class="quiz-body" style="display:none;">
      <div class="quiz-progress"><span id="quizProgressText"></span></div>
      <div class="quiz-question-row">
        <div class="quiz-question" id="quizQuestion"></div>
        <button class="speak-btn quiz-speak-btn" id="quizSpeakBtn" title="발음 듣기">🔊</button>
      </div>
      <div class="quiz-ipa" id="quizIpa"></div>
      <div class="quiz-options" id="quizOptions"></div>
      <button class="quiz-next-btn" id="quizNextBtn" style="display:none;">다음 문제 →</button>
    </div>
    <div id="quizResult" class="quiz-body" style="display:none;">
      <div class="quiz-score" id="quizScoreText"></div>
      <div class="quiz-wrong-list" id="quizWrongList"></div>
      <button class="quiz-start-btn" id="quizRetryWrongBtn" style="display:none; margin-bottom:10px; background:var(--accent2);">틀린 문제만 다시 풀기</button>
      <button class="quiz-start-btn" id="quizRetryBtn">처음부터 다시 풀기</button>
    </div>
  </div>
</div>

<main id="list"></main>

<footer>완료 · 총 4,007개 (No. 1–4007) · 품질 우선으로 여기서 마무리합니다 🎉</footer>

<script>
const WORDS = [
{no:1, word:"abandon", pos:"v.", kr:"포기하다, 버리다", root:"고프랑스어 a-(~에) + bandon(지배, 통제) → 통제권을 넘겨버리다", ex:"She had to abandon her plan due to lack of funding.", exkr:"그녀는 자금 부족으로 계획을 포기해야 했다.", ipa:"əˈbændən", syn:"give up, vacate, empty", ant:""},
{no:2, word:"abolish", pos:"v.", kr:"폐지하다", root:"라틴어 ab-(멀리) + olere(자라다) → 자라는 것을 없애다", ex:"The government decided to abolish the outdated law.", exkr:"정부는 그 낡은 법을 폐지하기로 결정했다.", ipa:"əˈbɑlɪʃ", syn:"eliminate, abrogate, eradicate", ant:"establish"},
{no:3, word:"abrupt", pos:"adj.", kr:"갑작스러운", root:"라틴어 ab-(떨어져) + rumpere(깨다) → 갑자기 끊어진", ex:"The meeting came to an abrupt end.", exkr:"그 회의는 갑작스럽게 끝났다.", ipa:"əˈbrəpt", syn:"disconnected, precipitous, sharp", ant:""},
{no:4, word:"absorb", pos:"v.", kr:"흡수하다", root:"라틴어 ab-(~로부터) + sorbere(빨아들이다)", ex:"Plants absorb water through their roots.", exkr:"식물은 뿌리를 통해 물을 흡수한다.", ipa:"əbˈzɔrb", syn:"assimilate, ingest, take in", ant:"emit"},
{no:5, word:"abstract", pos:"adj.", kr:"추상적인", root:"라틴어 abs-(멀리) + trahere(끌다) → 구체적인 것에서 끌어낸", ex:"The concept of freedom can seem abstract to young children.", exkr:"자유라는 개념은 어린아이들에게 추상적으로 보일 수 있다.", ipa:"ˈæbˌstrækt", syn:"theoretical, conceptual, intangible", ant:"concrete"},
{no:6, word:"abundant", pos:"adj.", kr:"풍부한", root:"라틴어 ab-(강조) + undare(물결치다) → 넘쳐흐르는", ex:"The region has abundant natural resources.", exkr:"그 지역은 풍부한 천연자원을 가지고 있다.", ipa:"əˈbəndənt", syn:"plentiful, ample, copious", ant:"scarce"},
{no:7, word:"academic", pos:"adj.", kr:"학문의", root:"그리스어 Akademeia(플라톤이 가르친 학원 이름)", ex:"She has a strong academic background in biology.", exkr:"그녀는 생물학 분야에서 탄탄한 학문적 배경을 가지고 있다.", ipa:"ˌækəˈdɛmɪk", syn:"scholarly, educational", ant:""},

    return;
  }
  resultCount.textContent = items.length + '개';
  items.forEach(w => {
    const card = document.createElement('div');
    card.className = 'card' + (markedWords.has(w.no) ? ' marked' : '');
    card.innerHTML = `
      <div class="card-top">
        <span class="no">No.${w.no}</span>
        <span class="word">${w.word}</span>
        <button class="speak-btn" onclick="speak('${w.word}')" title="발음 듣기" aria-label="발음 듣기">🔊</button>
        <button class="mark-btn ${markedWords.has(w.no) ? 'active' : ''}" onclick="toggleMark(${w.no})" title="암기 체크" aria-label="암기 체크">${markedWords.has(w.no) ? '★' : '☆'}</button>
        <span class="pos">${w.pos}</span>
      </div>
      <div class="ipa">${w.ipa ? '/' + w.ipa + '/' : ''}</div>
      <div class="kr">${w.kr}</div>
      ${w.syn ? `<div class="syn"><b>동의어</b> ${w.syn}</div>` : ''}
      ${w.ant ? `<div class="ant"><b>반의어</b> ${w.ant}</div>` : ''}
      <div class="root"><b>어원</b> — ${w.root}</div>
      <div class="ex">"${w.ex}"</div>
      <div class="exkr">${w.exkr}</div>
    `;
    list.appendChild(card);
  });
}

function speak(word){
  if(!('speechSynthesis' in window)){
    alert('이 브라우저는 음성 재생을 지원하지 않습니다.');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  window.speechSynthesis.speak(utter);
}

function updateProgress(){
  const pct = Math.min(100, (WORDS.length / TOTAL_GOAL) * 100);
  progressFill.style.width = pct + '%';
  progressLabel.textContent = `${WORDS.length} / ${TOTAL_GOAL} 단어 완료`;
}

/* ===== 누적 테스트(퀴즈) 기능 ===== */
const quizOverlay = document.getElementById('quizOverlay');
const quizOpenBtn = document.getElementById('quizOpenBtn');
const quizCloseBtn = document.getElementById('quizCloseBtn');
const quizSetup = document.getElementById('quizSetup');
const quizPlay = document.getElementById('quizPlay');
const quizResult = document.getElementById('quizResult');
const quizPoolCount = document.getElementById('quizPoolCount');
const quizRangeOptions = document.getElementById('quizRangeOptions');
const quizDirOptions = document.getElementById('quizDirOptions');
const quizCountOptions = document.getElementById('quizCountOptions');
const quizChoiceOptions = document.getElementById('quizChoiceOptions');
const quizStartBtn = document.getElementById('quizStartBtn');
const quizRetryBtn = document.getElementById('quizRetryBtn');
const quizNextBtn = document.getElementById('quizNextBtn');
const quizProgressText = document.getElementById('quizProgressText');
const quizQuestionEl = document.getElementById('quizQuestion');
const quizIpaEl = document.getElementById('quizIpa');
const quizOptionsEl = document.getElementById('quizOptions');
const quizScoreText = document.getElementById('quizScoreText');
const quizWrongList = document.getElementById('quizWrongList');
const quizSpeakBtn = document.getElementById('quizSpeakBtn');
const quizRangeStart = document.getElementById('quizRangeStart');
const quizRangeEnd = document.getElementById('quizRangeEnd');
const quizRangeApplyBtn = document.getElementById('quizRangeApplyBtn');
const quizRangeError = document.getElementById('quizRangeError');

let quizCount = 20;          // 'all' 이면 전체
let quizDirection = 'e2k';   // 'e2k' 영어→한글 | 'k2e' 한글→영어
let quizChoiceCount = 4;
let quizRangeValue = 'all';  // 'all' 또는 "start-end" 문자열
let quizQueue = [];
let quizIndex = 0;
let quizCorrect = 0;
let quizWrongAnswers = [];
let quizAnswered = false;

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildRangeOptions(){
  const max = WORDS.length;
  const blockSize = 200;
  let html = `<button data-range="all" class="active">전체 (1–${max})</button>`;
  for(let start = 1; start <= max; start += blockSize){
    const end = Math.min(start + blockSize - 1, max);
    html += `<button data-range="${start}-${end}">${start}–${end}</button>`;
  }
  quizRangeOptions.innerHTML = html;
  quizRangeOptions.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      quizRangeOptions.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      quizRangeValue = btn.dataset.range;
      quizRangeError.textContent = '';
      quizRangeStart.value = '';
      quizRangeEnd.value = '';
    });
  });
  quizRangeValue = 'all';
  quizRangeStart.max = max;
  quizRangeEnd.max = max;
}

quizRangeApplyBtn.addEventListener('click', () => {
  const max = WORDS.length;
  const s = parseInt(quizRangeStart.value, 10);
  const e = parseInt(quizRangeEnd.value, 10);

  if(isNaN(s) || isNaN(e)){
    quizRangeError.textContent = '시작과 끝 번호를 모두 입력해 주세요.';
    return;
  }
  if(s < 1 || e > max || s > e){
    quizRangeError.textContent = `1 ~ ${max} 사이에서, 시작 ≤ 끝 이 되도록 입력해 주세요.`;
    return;
  }
  quizRangeError.textContent = '';
  quizRangeValue = `${s}-${e}`;
  quizRangeOptions.querySelectorAll('button').forEach(b => b.classList.remove('active'));
});

function getPoolByRange(){
  if(quizRangeValue === 'all') return WORDS;
  const [start, end] = quizRangeValue.split('-').map(Number);
  return WORDS.filter(w => w.no >= start && w.no <= end);
}

quizOpenBtn.addEventListener('click', () => {
  quizPoolCount.textContent = WORDS.length;
  buildRangeOptions();
  quizSetup.style.display = 'block';
  quizPlay.style.display = 'none';
  quizResult.style.display = 'none';
  quizOverlay.classList.add('open');
});

quizCloseBtn.addEventListener('click', () => {
  quizOverlay.classList.remove('open');
  window.speechSynthesis && window.speechSynthesis.cancel();
});

quizOverlay.addEventListener('click', (e) => {
  if(e.target === quizOverlay){
    quizOverlay.classList.remove('open');
    window.speechSynthesis && window.speechSynthesis.cancel();
  }
});

quizDirOptions.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    quizDirOptions.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    quizDirection = btn.dataset.dir;
  });
});

quizCountOptions.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    quizCountOptions.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    quizCount = btn.dataset.n === 'all' ? 'all' : parseInt(btn.dataset.n, 10);
  });
});

quizChoiceOptions.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    quizChoiceOptions.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    quizChoiceCount = parseInt(btn.dataset.c, 10);
  });
});

const quizRetryWrongBtn = document.getElementById('quizRetryWrongBtn');

quizStartBtn.addEventListener('click', startQuiz);
quizRetryBtn.addEventListener('click', () => {
  quizSetup.style.display = 'block';
  quizResult.style.display = 'none';
  quizPoolCount.textContent = WORDS.length;
});
quizRetryWrongBtn.addEventListener('click', startWrongOnlyQuiz);
quizNextBtn.addEventListener('click', nextQuestion);
quizSpeakBtn.addEventListener('click', () => {
  const current = quizQueue[quizIndex];
  if(current) speak(current.word);
});

function startQuiz(){
  const pool = getPoolByRange();
  const n = quizCount === 'all' ? pool.length : Math.min(quizCount, pool.length);
  quizQueue = shuffleArray(pool).slice(0, n);
  quizIndex = 0;
  quizCorrect = 0;
  quizWrongAnswers = [];
  quizSetup.style.display = 'none';
  quizResult.style.display = 'none';
  quizPlay.style.display = 'block';
  showQuestion();
}

function startWrongOnlyQuiz(){
  const wrongNos = new Set(quizWrongAnswers.map(w => w.no));
  const pool = WORDS.filter(w => wrongNos.has(w.no));
  if(pool.length === 0) return;
  quizQueue = shuffleArray(pool);
  quizIndex = 0;
  quizCorrect = 0;
  quizWrongAnswers = [];
  quizSetup.style.display = 'none';
  quizResult.style.display = 'none';
  quizPlay.style.display = 'block';
  showQuestion();
}

function showQuestion(){
  quizAnswered = false;
  quizNextBtn.style.display = 'none';
  const current = quizQueue[quizIndex];
  quizProgressText.textContent = `${quizIndex + 1} / ${quizQueue.length}  (맞음: ${quizCorrect})`;

  const e2k = quizDirection === 'e2k';
  quizQuestionEl.textContent = e2k ? current.word : current.kr;
  quizIpaEl.textContent = e2k && current.ipa ? '/' + current.ipa + '/' : '';
  quizSpeakBtn.style.display = e2k ? 'inline-flex' : 'none';

  const pool = getPoolByRange().length >= quizChoiceCount ? getPoolByRange() : WORDS;
  const distractorPool = pool.filter(w => w.no !== current.no);
  const numDistractors = Math.min(quizChoiceCount - 1, distractorPool.length);
  const distractors = shuffleArray(distractorPool).slice(0, numDistractors);
  const correctVal = e2k ? current.kr : current.word;
  const distractorVals = distractors.map(w => e2k ? w.kr : w.word);
  const options = shuffleArray([correctVal, ...distractorVals]);

  quizOptionsEl.innerHTML = '';
  options.forEach(optVal => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = optVal;
    btn.addEventListener('click', () => selectAnswer(btn, optVal, current, correctVal));
    quizOptionsEl.appendChild(btn);
  });
}

function selectAnswer(btn, chosenVal, current, correctVal){
  if(quizAnswered) return;
  quizAnswered = true;
  const allBtns = quizOptionsEl.querySelectorAll('.quiz-option');
  const isCorrect = chosenVal === correctVal;
  if(isCorrect){
    quizCorrect++;
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    quizWrongAnswers.push({ no: current.no, word: current.word, kr: current.kr, chosen: chosenVal, correct: correctVal });
    allBtns.forEach(b => {
      if(b.textContent === correctVal) b.classList.add('correct');
    });
  }
  allBtns.forEach(b => b.disabled = true);
  quizNextBtn.style.display = 'block';
  quizNextBtn.textContent = (quizIndex === quizQueue.length - 1) ? '결과 보기 →' : '다음 문제 →';
}

function nextQuestion(){
  quizIndex++;
  if(quizIndex >= quizQueue.length){
    showResult();
  } else {
    showQuestion();
  }
}

function showResult(){
  quizPlay.style.display = 'none';
  quizResult.style.display = 'block';
  const total = quizQueue.length;
  const pct = total ? Math.round((quizCorrect / total) * 100) : 0;
  quizScoreText.textContent = `${quizCorrect} / ${total} 정답 (${pct}%)`;
  if(quizWrongAnswers.length === 0){
    quizWrongList.innerHTML = '<div class="quiz-wrong-item">🎉 전부 맞혔습니다!</div>';
    quizRetryWrongBtn.style.display = 'none';
  } else {
    quizWrongList.innerHTML = quizWrongAnswers.map(w => `
      <div class="quiz-wrong-item">
        <b>${w.word}</b> (${w.kr}) — 정답: <span class="correct-kr">${w.correct}</span> / 선택: <span class="wrong-kr">${w.chosen}</span>
      </div>
    `).join('');
    quizRetryWrongBtn.style.display = 'block';
    quizRetryWrongBtn.textContent = `틀린 문제만 다시 풀기 (${quizWrongAnswers.length}개)`;
  }
}

const startNoInput = document.getElementById('startNoInput');
const startNoGoBtn = document.getElementById('startNoGoBtn');
const startNoResetBtn = document.getElementById('startNoResetBtn');
const startNoCurrent = document.getElementById('startNoCurrent');
const STORAGE_KEY = 'suneung_vocab_start_no';
const MARK_STORAGE_KEY = 'suneung_vocab_marked_words';

let currentStartNo = 1;
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved && !isNaN(parseInt(saved, 10))){
    currentStartNo = Math.max(1, parseInt(saved, 10));
  }
} catch(e){ /* localStorage 사용 불가 시 무시 */ }

let markedWords = new Set();
try {
  const savedMarks = localStorage.getItem(MARK_STORAGE_KEY);
  if(savedMarks){
    markedWords = new Set(JSON.parse(savedMarks).map(Number));
  }
} catch(e){ /* localStorage 사용 불가 시 무시 */ }

let showOnlyMarked = false;
const markFilterBtn = document.getElementById('markFilterBtn');
const markCountLabel = document.getElementById('markCountLabel');

function saveMarkedWords(){
  try { localStorage.setItem(MARK_STORAGE_KEY, JSON.stringify([...markedWords])); } catch(e){}
}

function toggleMark(no){
  if(markedWords.has(no)){
    markedWords.delete(no);
  } else {
    markedWords.add(no);
  }
  saveMarkedWords();
  updateMarkCountLabel();
  applyFilters();
}

function updateMarkCountLabel(){
  markCountLabel.textContent = markedWords.size > 0 ? `(${markedWords.size}개 체크됨)` : '';
}

markFilterBtn.addEventListener('click', () => {
  showOnlyMarked = !showOnlyMarked;
  markFilterBtn.classList.toggle('active', showOnlyMarked);
  markFilterBtn.textContent = showOnlyMarked ? '📌 전체 보기' : '📌 체크한 단어만 보기';
  applyFilters();
});

function updateStartNoLabel(){
  if(currentStartNo > 1){
    startNoCurrent.textContent = `현재 No.${currentStartNo}부터 보는 중`;
    startNoInput.value = currentStartNo;
  } else {
    startNoCurrent.textContent = '';
  }
}

function applyFilters(){
  const q = search.value.trim().toLowerCase();
  let base = WORDS.filter(w => w.no >= currentStartNo);
  if(showOnlyMarked){
    base = base.filter(w => markedWords.has(w.no));
  }
  if(q){
    base = base.filter(w =>
      w.word.toLowerCase().includes(q) || w.kr.includes(q) || (w.syn && w.syn.toLowerCase().includes(q))
    );
  }
  render(base);
}

startNoGoBtn.addEventListener('click', () => {
  const n = parseInt(startNoInput.value, 10);
  if(isNaN(n) || n < 1){
    alert('1 이상의 유효한 번호를 입력해 주세요.');
    return;
  }
  currentStartNo = Math.min(n, WORDS.length);
  try { localStorage.setItem(STORAGE_KEY, String(currentStartNo)); } catch(e){}
  updateStartNoLabel();
  applyFilters();
  window.scrollTo({ top: list.offsetTop - 20, behavior: 'smooth' });
});

startNoResetBtn.addEventListener('click', () => {
  currentStartNo = 1;
  startNoInput.value = '';
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  updateStartNoLabel();
  applyFilters();
});

search.addEventListener('input', applyFilters);

updateStartNoLabel();
updateMarkCountLabel();
applyFilters();
updateProgress();
</script>

</html>
